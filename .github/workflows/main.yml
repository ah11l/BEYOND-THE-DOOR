name: Build BEYOND THE DOOR (APK + Google Play AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    env:
      BTD_RELEASE_KEYSTORE_BASE64: ${{ secrets.BTD_RELEASE_KEYSTORE_BASE64 }}
      BTD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.BTD_RELEASE_KEYSTORE_PASSWORD }}
      BTD_RELEASE_KEY_ALIAS: ${{ secrets.BTD_RELEASE_KEY_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Godot Android templates and Java SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /root/.config/godot builds
          JAVA_DIR="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          ANDROID_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          cat > /root/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/android_sdk_path = "${ANDROID_DIR}"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Fetch Poing Studios AdMob v5.1.0 GDScript addon
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f addons/admob/plugin.cfg ]; then
            curl -fsSL https://github.com/poingstudios/godot-admob-plugin/archive/refs/tags/v5.1.0.zip -o /tmp/admob_v510.zip || true
            if [ -s /tmp/admob_v510.zip ]; then
              unzip -q /tmp/admob_v510.zip -d /tmp/admob_extract
              SRC_ADDON=$(find /tmp/admob_extract -type d -path "*/addons/admob" | head -n 1)
              if [ -n "$SRC_ADDON" ]; then
                cp -rn "$SRC_ADDON/." addons/admob/ || true
              fi
            fi
          fi

      - name: Import project resources
        shell: bash
        env:
          HOME: /root
        run: godot --headless --path . --import || godot --headless --editor --path . --quit || true

      - name: Export debug APK
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android Debug APK" builds/beyond_the_door_debug.apk
          test -s builds/beyond_the_door_debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-door-debug-apk
          path: builds/beyond_the_door_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Gradle template, AdMob Manifest & Release Keystore (for Google Play AAB)
        if: ${{ env.BTD_RELEASE_KEYSTORE_BASE64 != '' && env.BTD_RELEASE_KEYSTORE_PASSWORD != '' && env.BTD_RELEASE_KEY_ALIAS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BTD_RELEASE_KEYSTORE_BASE64" | base64 --decode > builds/release.keystore
          test -s builds/release.keystore

          # Unpack Godot 4.5.2 Android Gradle build template if not present
          if [ ! -d android/build ]; then
            mkdir -p android/build
            unzip -q /root/.local/share/godot/export_templates/4.5.2.stable/android_source.zip -d android/build
          fi

          # Inject AdMob APPLICATION_ID into AndroidManifest.xml + configure release keystore in export_presets.cfg
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          mf = Path("android/build/AndroidManifest.xml")
          if mf.exists():
              xml = mf.read_text(encoding="utf-8")
              if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
                  meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2956752840406313~2454089044" />\n'
                  xml = xml.replace("</application>", meta + "    </application>", 1)
                  mf.write_text(xml, encoding="utf-8")

          ep = Path("export_presets.cfg")
          text = ep.read_text(encoding="utf-8")
          idx = text.find("[preset.1.options]")
          head, sec = text[:idx], text[idx:]
          repl = {
              "keystore/release": "builds/release.keystore",
              "keystore/release_user": os.environ["BTD_RELEASE_KEY_ALIAS"],
              "keystore/release_password": os.environ["BTD_RELEASE_KEYSTORE_PASSWORD"],
          }
          for k, v in repl.items():
              sec = re.sub(rf'(?m)^{re.escape(k)}=".*"$', f"{k}={json.dumps(v)}", sec, count=1)
          ep.write_text(head + sec, encoding="utf-8")
          PY

      - name: Export signed Google Play AAB (with AdMob Gradle Build)
        if: ${{ env.BTD_RELEASE_KEYSTORE_BASE64 != '' && env.BTD_RELEASE_KEYSTORE_PASSWORD != '' && env.BTD_RELEASE_KEY_ALIAS != '' }}
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Android Google Play AAB" builds/beyond_the_door_release.aab
          test -s builds/beyond_the_door_release.aab

      - name: Upload signed Google Play AAB
        if: ${{ env.BTD_RELEASE_KEYSTORE_BASE64 != '' && env.BTD_RELEASE_KEYSTORE_PASSWORD != '' && env.BTD_RELEASE_KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-door-google-play-aab
          path: builds/beyond_the_door_release.aab
          if-no-files-found: error
          retention-days: 14

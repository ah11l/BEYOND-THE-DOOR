name: Build BEYOND THE DOOR (QA + APK + Google Play AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-audit:
    name: Static QA Audit (120 Stages & Assets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run 120-Stage & Asset Integrity Audit
        run: python3 tools/qa_stage_audit.py

  export-android:
    name: Export Android Debug APK & Signed Google Play AAB
    needs: qa-audit
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    env:
      BTD_RELEASE_KEYSTORE_BASE64: ${{ secrets.BTD_RELEASE_KEYSTORE_BASE64 }}
      BTD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.BTD_RELEASE_KEYSTORE_PASSWORD }}
      BTD_RELEASE_KEY_ALIAS: ${{ secrets.BTD_RELEASE_KEY_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Godot Android templates and Java SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /root/.config/godot builds
          JAVA_DIR="${JAVA_HOME:-$(dirname$(dirname $(readlink -f$(which java))))}"
          ANDROID_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          cat > /root/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/android_sdk_path = "${ANDROID_DIR}"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Fetch Poing Studios AdMob v5.1.0 GDScript addon (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f addons/admob/plugin.cfg ]; then
            if command -v wget >/dev/null 2>&1; then
              wget -q https://github.com/poingstudios/godot-admob-plugin/archive/refs/tags/v5.1.0.zip -O /tmp/admob_v510.zip || true
            elif command -v curl >/dev/null 2>&1; then
              curl -fsSL 
              
